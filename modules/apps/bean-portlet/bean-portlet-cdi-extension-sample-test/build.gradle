apply plugin: "war"

dependencies {
	compileOnly group: "com.liferay.jakarta.portlet", name: "com.liferay.jakarta.portlet-api", version: "4.0.0"
	compileOnly group: "jakarta.enterprise", name: "jakarta.enterprise.cdi-api", version: "4.1.0"
	compileOnly group: "jakarta.faces", name: "jakarta.faces-api", version: "4.1.2"
	implementation group: "com.liferay.faces", name: "com.liferay.faces.bridge.api", version: "4.3.0"
	implementation group: "com.liferay.faces", name: "com.liferay.faces.bridge.ext", version: "6.1.1"
	implementation group: "com.liferay.faces", name: "com.liferay.faces.bridge.impl", version: "4.3.0"
	implementation group: "org.glassfish", name: "jakarta.faces", version: "4.1.3"
}

deploy {
	from war

	rename {
		"bean-portlet-cdi-extension-sample-test.war"
	}
}

liferay {
	deployDir = file("${liferayHome}/osgi/war")
}